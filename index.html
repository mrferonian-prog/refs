<!doctype html>
<html data-mode="public" lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refbase — референсы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;family=Unbounded:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8E9EC; --panel:#F3F4F6; --surface:#FFFFFF; --ink:#15171C; --ink-2:#474C56; --muted:#7A808B;
  --line:#D2D5DB; --line-2:#E3E5E9; --accent:#2B3BFF; --accent-ink:#FFFFFF; --accent-soft:#E2E5FF;
  --danger:#D3342B; --ok:#1E8A4C; --table:#1C1E23;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131418; --panel:#191B20; --surface:#22252B; --ink:#ECEDF0; --ink-2:#B8BCC5; --muted:#858A95;
    --line:#32353C; --line-2:#292C32; --accent:#7380FF; --accent-ink:#0E0F12; --accent-soft:#252A52;
    --danger:#FF5A50; --ok:#4CC782; --table:#0E0F12; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Onest,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:264px 1fr;height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;padding:18px 12px 14px}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:12px 28px;border-bottom:1px solid var(--line)}
.content{flex:1;overflow:auto;padding:4px 28px 80px}

.logo{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;font:600 17px/1 Unbounded,sans-serif;letter-spacing:-.01em}
.logo em{font:500 11px Onest,sans-serif;color:var(--muted);font-style:normal;margin-left:auto;border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line-2);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:7px 6px;border-radius:7px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sec{margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:500;padding:0 8px 5px}
.sec-h button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 5px;border-radius:5px}
.sec-h button:hover{color:var(--ink);background:var(--line-2)}
.item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 8px;border-radius:7px;text-align:left;color:var(--ink-2);min-height:32px}
.item:hover{background:var(--line-2)}
.item.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.item .ed{display:none;color:var(--muted);border-radius:5px;padding:1px}
.item:hover .ed{display:inline-flex}
.item:hover .ed + .n,.item .ed:hover{color:var(--ink)}
.item.zero{color:var(--muted)}
.item.drop,.folder.drop .cover{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.side-empty{font-size:12px;color:var(--muted);padding:2px 8px;line-height:1.5}
.facet{margin:14px 8px 0}
.facet-t{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.facet-t button{border:0;background:none;color:var(--muted);font-size:12px;padding:0}
.facet-t button:hover{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px;line-height:18px;color:var(--ink-2);cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{color:var(--muted);font-size:11px}
.chip.on small{color:inherit;opacity:.75}
.chip .x{font-style:normal;opacity:.55;margin-right:-3px;padding:0 2px}
.chip .x:hover{opacity:1}
.queue{margin-top:auto;padding:16px 8px 0;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}

.burger{display:none}
.search{flex:1;max-width:560px;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 36px 0 35px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{position:absolute;right:9px;font:500 11px Onest,sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;pointer-events:none}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pubinfo{font-size:12px;color:var(--muted);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap;text-decoration:none;position:relative}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.icon{width:36px;padding:0}
.btn.sm.icon{width:30px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.lnk{border:0;background:none;color:var(--muted);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.lnk:hover{color:var(--ink)}

.phead{display:flex;align-items:center;gap:14px;padding:26px 0 16px;flex-wrap:wrap}
.phead h1{font:600 26px/1.15 Unbounded,sans-serif;margin:0;letter-spacing:-.015em}
.phead .cnt{color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.crumb{border:0;background:none;color:var(--muted);display:inline-flex;align-items:center;gap:2px;padding:4px 6px 4px 0;font-weight:500}
.crumb:hover{color:var(--ink)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.swt{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.swt input{appearance:none;width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.swt input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.swt input:checked{background:var(--accent)}
.swt input:checked::after{transform:translateX(12px)}
select.sm{height:30px;width:auto;padding:0 8px;font-size:13px;border-radius:8px}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 16px}

.grp{margin-top:10px}
.grp-h{position:sticky;top:-4px;z-index:3;background:var(--bg);display:flex;align-items:baseline;gap:10px;padding:14px 0 12px}
.grp-h h2{font:500 17px/1.2 Unbounded,sans-serif;margin:0;letter-spacing:-.01em}
.grp-h span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.grp-h .lnk{margin-left:auto}
.grid{columns:232px;column-gap:18px}
.card{break-inside:avoid;margin:0 0 20px;position:relative;cursor:pointer;display:block}
.thumb{position:relative;border-radius:10px;overflow:hidden;background:var(--line-2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .2s}
.thumb img.ld{opacity:1}
.thumb::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);pointer-events:none;transition:box-shadow .12s}
.card:hover .thumb::after{box-shadow:inset 0 0 0 2px var(--ink)}
.cmeta{padding:8px 2px 0}
.ctitle{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.bbtn{position:absolute;top:8px;right:8px;height:30px;min-width:30px;padding:0 8px;border-radius:8px;border:0;background:rgba(255,255,255,.94);color:#15171C;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600;opacity:0;transition:opacity .12s;box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:2}
.card:hover .bbtn,.bbtn.has,.bbtn:focus-visible{opacity:1}
.ai{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;background:rgba(21,23,28,.85);color:#fff;display:flex;gap:6px;align-items:center;z-index:2}
.ai.err{background:var(--danger);color:#fff}
.card.dragging{opacity:.35}
.noimg{display:none}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;padding:12px;text-align:center}
.spin{width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}*{transition:none!important}}

.empty{border:1.5px dashed var(--line);border-radius:16px;padding:64px 24px;text-align:center;color:var(--ink-2);margin-top:6px}
.empty h3{font:500 18px Unbounded,sans-serif;margin:0 0 8px;color:var(--ink)}
.empty p{margin:0 auto 20px;max-width:440px;line-height:1.55}
.empty .row{justify-content:center}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 20px}
.folder{cursor:pointer;border:0;background:none;padding:0;text-align:left;display:block}
.cover{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--line-2);display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;min-height:0;opacity:0;transition:opacity .2s}
.cover img.ld{opacity:1}
.cover img:first-child{grid-row:span 2}
.cover.n1,.cover.n0{grid-template-columns:1fr;grid-template-rows:1fr}
.cover.n1 img{grid-row:auto}
.cover.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.cover.n2 img:first-child{grid-row:auto}
.cover-e{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.folder:hover .cover{box-shadow:0 0 0 2px var(--ink)}
.fname{font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcnt{color:var(--muted);font-size:12px;margin-top:1px}
.folder.new .cover{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;background:none;border:1.5px dashed var(--line);color:var(--ink-2);font-weight:500}
.folder.new:hover .cover{border-color:var(--ink-2);box-shadow:none}

#layer{position:relative;z-index:40}
.ov{position:fixed;inset:0;background:rgba(10,11,14,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.dlg{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column}
.dlg.wide{width:min(720px,100%)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 4px 22px}
.dlg-h h3{font:600 17px/1.3 Unbounded,sans-serif;margin:0}
.dlg-b{padding:8px 22px 18px;overflow:auto}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:6px 22px 20px;flex-wrap:wrap}
.dlg-f .grow{margin-right:auto}
label.f{display:block;margin:14px 0 0}
.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.inp{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 11px;outline:none}
textarea.inp{height:auto;padding:9px 11px;min-height:76px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}
.hint b{color:var(--ink-2);font-weight:600}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--line-2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.steps{margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.6;color:var(--ink-2)}
.steps li{margin-bottom:6px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);padding:0 22px;margin-top:6px}
.tabs button{border:0;background:none;padding:10px 0;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.prov{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.prov label{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:block}
.prov label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.prov input{position:absolute;opacity:0;pointer-events:none}
.prov b{display:block;font-weight:600}
.prov small{color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:9px;margin-top:14px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.box{border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;margin-top:14px;background:var(--bg)}
.srcnote{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.result{font-size:13px;margin-top:10px;line-height:1.5}
.result.ok{color:var(--ok)}
.result.err{color:var(--danger)}
.dz{border:1.5px dashed var(--line);border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-2)}
.dz b{color:var(--ink);font-weight:600}
.dz span{font-size:12px;color:var(--muted)}
.dz:hover,.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.prog{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.log{font-size:12px;color:var(--ink-2);background:var(--bg);border-radius:8px;padding:10px 12px;max-height:170px;overflow:auto;white-space:pre-wrap;margin-top:10px;line-height:1.55}
.stat{display:flex;gap:24px;flex-wrap:wrap;margin-top:4px}
.stat div{font-size:12px;color:var(--muted)}
.stat b{display:block;font:500 18px Unbounded,sans-serif;color:var(--ink)}

.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.2);width:264px;padding:8px}
.pop-h{font-size:12px;color:var(--muted);padding:4px 8px 6px}
.pop-list{max-height:270px;overflow:auto}
.pop label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer}
.pop label:hover{background:var(--line-2)}
.pop label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.pop .inp{height:34px;margin-top:6px}
.pop-e{font-size:12px;color:var(--muted);padding:4px 8px 6px}

.sheet-ov{position:fixed;inset:0;z-index:45;background:rgba(10,11,14,.72);display:flex;padding:18px}
.sheet{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;background:var(--surface);border-radius:16px;overflow:hidden;min-height:0;position:relative}
.sheet-img{background:var(--table);overflow:auto;position:relative;display:flex;justify-content:center;align-items:flex-start;padding:32px}
.sheet-img.center{align-items:center}
.sheet-img img{max-width:100%;height:auto;display:block;border-radius:4px;box-shadow:0 14px 50px rgba(0,0,0,.45)}
.sheet-img .ph{color:#8A8F99;margin:auto}
.imgcol{position:relative;min-width:0;min-height:0;display:flex}
.imgcol .sheet-img{flex:1}
.navb{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.navb:hover{background:rgba(255,255,255,.24)}
.navb.l{left:14px}
.navb.r{right:14px}
.imgcol .x{position:absolute;top:14px;left:14px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff}
.imgcol .x:hover{background:rgba(255,255,255,.24)}
.sheet-info{overflow:auto;padding:22px 26px 34px;border-left:1px solid var(--line)}
.ttl-in,.ttl{font:600 20px/1.3 Unbounded,sans-serif;border:0;background:none;width:calc(100% - 40px);padding:4px 6px;margin:0 0 0 -6px;border-radius:7px;outline:none;letter-spacing:-.01em}
.ttl-in:hover{background:var(--line-2)}
.ttl-in:focus{background:var(--bg);box-shadow:0 0 0 2px var(--accent-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.src{display:flex;align-items:center;gap:6px;margin-top:10px}
.src .inp{height:32px;font-size:13px}
.src a.ext{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-size:13px;text-decoration:none}
.src a.ext:hover{color:var(--ink)}
.aibar{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:12px;color:var(--muted)}
.aibar .btn{margin-left:auto}
.aibar.err{color:var(--danger);flex-wrap:wrap;line-height:1.45}
.aibar.err>span{flex:1 0 100%}
.aibar.err .btn{margin-left:0}
.desc{margin:16px 0 0;color:var(--ink-2);line-height:1.55}
.blk{margin-top:22px}
.blk-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-weight:600;font-size:13px;margin-bottom:9px}
.blk-h .sub{font-weight:400;color:var(--muted);font-size:12px}
.blk-h .act{margin-left:auto;display:flex;gap:10px}
.tag-add{border:1px dashed var(--line);background:none;border-radius:999px;padding:2px 10px;font-size:12px;line-height:18px;color:var(--ink);width:104px;outline:none}
.tag-add:focus{border-style:solid;border-color:var(--accent);width:150px}
.font{border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.font .sample{font-size:24px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.font .meta{font-size:12px;color:var(--muted);margin-top:2px}
.conf{height:3px;background:var(--line-2);border-radius:2px;margin-top:8px}
.conf i{display:block;height:100%;background:var(--ink-2);border-radius:2px}
.alts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center;font-size:12px;color:var(--muted)}
.font-acts{display:flex;gap:14px;margin-top:8px;font-size:12px}
.font-acts a,.font-acts button{color:var(--muted);border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);font-size:12px}
.font-acts a:hover,.font-acts button:hover{color:var(--ink)}
.strip{display:flex;height:30px;border-radius:7px;overflow:hidden;outline:1px solid var(--line);outline-offset:-1px}
.strip button{outline:0}
.strip button{border:0;padding:0;min-width:10px;cursor:pointer}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.swc{border:1px solid var(--line-2);border-radius:9px;overflow:hidden;cursor:pointer;background:var(--surface);text-align:left;padding:0}
.swc i{display:block;height:44px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)}
.swc div{padding:6px 8px 7px;font-size:11px;line-height:1.35;color:var(--muted)}
.swc b{display:block;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ds-sec{border-top:1px solid var(--line-2);padding:13px 0 4px}
.ds-t{font-size:12px;color:var(--muted);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.ty{display:grid;grid-template-columns:76px minmax(0,1fr);gap:2px 12px;align-items:baseline;padding:6px 0}
.ty .r{font-size:11px;color:var(--muted)}
.ty .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.ty .m{grid-column:2;font-size:11px;color:var(--muted)}
.boxes{display:flex;flex-wrap:wrap;gap:12px}
.bx{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);max-width:110px}
.bx i{display:block;width:72px;height:52px;background:var(--surface);border:1px solid var(--line)}
.bx.sh i{border-color:transparent;background:#fff}
.spc{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.spc div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.spc i{display:block;background:var(--accent);opacity:.75;width:14px;border-radius:2px}
.cmp{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line-2);border-radius:10px;margin-bottom:8px;background:var(--bg)}
.cmp .prev{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .d{font-size:12px;color:var(--muted);line-height:1.45}
.cmp .k{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.gridv{display:flex;gap:3px;height:34px;margin-top:8px}
.gridv i{flex:1;background:var(--accent-soft);border:1px solid var(--accent);opacity:.7;border-radius:2px}
.notes{margin-top:22px}
.dfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line-2)}
.dfoot .danger{margin-left:auto}

#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:10px;font-size:13px;max-width:min(560px,90vw);box-shadow:0 8px 24px rgba(0,0,0,.22);pointer-events:auto}
.toast.err{background:var(--danger);color:#fff}
.veil{position:fixed;inset:10px;z-index:80;border:2px dashed var(--accent);border-radius:18px;background:color-mix(in srgb,var(--accent) 10%,transparent);display:none;align-items:center;justify-content:center;font:500 22px Unbounded,sans-serif;color:var(--accent);pointer-events:none;backdrop-filter:blur(2px)}
.veil.show{display:flex}
.side-bd{display:none}

@media (max-width: 1100px){ .sheet{grid-template-columns:minmax(0,1fr) 380px} }
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:284px;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}

  .navb{display:none}
  .imgcol .x{position:fixed;top:10px;left:auto;right:10px;background:rgba(20,22,26,.7)}
  .prov{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .pubinfo{display:none}
}

/* ---------- IndexedDB ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('refbase', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('refs', { keyPath: 'id' }); d.createObjectStore('boards', { keyPath: 'id' }); d.createObjectStore('files'); d.createObjectStore('meta'); };

  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store); let out;
      const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Транзакция прервана'));

  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  get(store, key) { return this.tx(store, 'readonly', s => s.get(key)); },

      <div class="grid2"><label class="f"><span>Имя репозитория</span><input class="inp" data-gh="repo" value="${esc(g.repo)}"></label><label class="f"><span>Ветка</span><input class="inp" data-gh="branch" value="${esc(g.branch)}"></label></div>
      <div class="hint">Сайт будет по адресу <b>https://ваш-логин.github.io/${esc(g.repo || 'refs')}/</b>. На бесплатном тарифе GitHub Pages работает только с публичными репозиториями.${g.url ? `<br>Текущий адрес: <a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.url)}</a>` : ''}</div>
      <div class="row"><button class="btn primary" id="st-pub">${I.globe}Перейти к публикации</button></div>`;
      m.q('#st-pub').onclick = () => { m.close(); openPublish(); };
    }
    if (t === 'data') {
      body.innerHTML = `<div class="stat" style="margin-top:14px"><div><b>${S.refs.length}</b>референсов</div><div><b>${S.boards.length}</b>досок</div><div><b id="st-usage">…</b>занято в браузере</div></div>
      <p class="hint">База хранится в этом браузере на этом компьютере. Регулярно сохраняйте резервную копию: при очистке данных браузера база удалится. Ключи и токен в копию не попадают.</p>
      <div class="row"><button class="btn" id="st-exp">Сохранить резервную копию</button><button class="btn" id="st-imp">Восстановить из копии</button></div>
      <div class="box"><b>Опасная зона</b><div class="hint">Удаляет все референсы, доски и типы из этого браузера. Опубликованный сайт не изменится.</div><div class="row"><button class="btn danger sm" id="st-wipe">Удалить всё</button></div></div>`;
      navigator.storage?.estimate?.().then(e => { const el = m.q('#st-usage'); if (el) el.textContent = (e.usage / 1048576).toFixed(1) + ' МБ'; }).catch(() => {});
      m.q('#st-exp').onclick = exportBackup;
      m.q('#st-imp').onclick = () => { const p = $('#importpick'); p.onchange = () => { const f = p.files[0]; p.value = ''; if (f) { m.close(); importBackup(f); } }; p.click(); };
      m.q('#st-wipe').onclick = async () => { if (!(await confirmDlg('Удалить всю базу?', 'Все референсы, изображения, доски и типы будут удалены из этого браузера. Это нельзя отменить.', 'Удалить всё'))) return; for (const st of ['refs', 'boards', 'files']) await DB.clear(st); S.refs = []; S.boards = []; S.types = structuredClone(DEFAULT_TYPES); await saveTypes(); thumbCache.clear(); m.close(); S.view = 'library'; S.type = 'all'; render(); toast('База очищена'); };
    }
  };
  m.el.addEventListener('click', e => { const b = e.target.closest('.tabs button'); if (b) draw(b.dataset.t); });
  m.el.addEventListener('input', e => {
    const k = e.target.dataset.s, gk = e.target.dataset.gh; if (!k && !gk) return;
    if (k) s[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value.trim();
    if (gk) s.gh[gk] = e.target.value.trim();
    saveSettings();
  });
  m.el.addEventListener('change', e => { if (['lang', 'autoAnalyze', 'webFetch', 'customFormat'].includes(e.target.dataset.s)) { s[e.target.dataset.s] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; saveSettings(); } });
  draw(tab);
}
async function exportBackup() {
  toast('Готовлю резервную копию…');
  const parts = ['{"format":"refbase-backup","version":1,"exportedAt":', String(Date.now()), ',"types":', JSON.stringify(S.types), ',"boards":', JSON.stringify(S.boards), ',"refs":', JSON.stringify(S.refs), ',"files":{'];
  let first = true;
  for (const r of S.refs) for (const k of FILE_KINDS) {
    const b = await getFile(r.id, k); if (!b) continue;
    parts.push((first ? '' : ',') + JSON.stringify(r.id + ':' + k) + ':' + JSON.stringify(await blobToDataURL(b))); first = false;
  }
  parts.push('}}');
  download(new Blob(parts, { type: 'application/json' }), `refbase-${new Date().toISOString().slice(0, 10)}.json`);
}
async function importBackup(file) {
  let d; try { d = JSON.parse(await file.text()); } catch { return toast('Файл не читается как резервная копия', 'err'); }
  if (d.format !== 'refbase-backup') return toast('Это не резервная копия Refbase', 'err');
  const mode = await choiceDlg('Восстановить из копии', `В копии ${nRefs(d.refs?.length || 0)} и ${d.boards?.length || 0} ${plural(d.boards?.length || 0, 'доска', 'доски', 'досок')}. Заменить текущую базу или добавить к ней?`, [{ k: 'merge', label: 'Добавить к текущей' }, { k: 'replace', label: 'Заменить', cls: 'primary' }]);
  if (!mode) return;
  if (mode === 'replace') { for (const st of ['refs', 'boards', 'files']) await DB.clear(st); S.refs = []; S.boards = []; S.types = []; thumbCache.clear(); }
  for (const t of d.types || []) if (!typeById(t.id)) S.types.push(t);
  await saveTypes();
  for (const b of d.boards || []) { if (!boardById(b.id)) S.boards.push(b); await DB.put('boards', b); }
  for (const [k, v] of Object.entries(d.files || {})) await DB.put('files', dataURLToBlob(v), k);
  for (const r of d.refs || []) { normalizeRef(r); if (r.ai?.status === 'running' || r.ai?.status === 'pending') r.ai = { status: 'none' }; S.refs = S.refs.filter(x => x.id !== r.id); S.refs.push(r); dropThumb(r.id); await DB.put('refs', r); }
  S.refs.sort((a, b) => b.createdAt - a.createdAt); markChanged(); render(); toast('Восстановлено: ' + nRefs(d.refs?.length || 0));
}

/* ---------- события ---------- */
const ACTIONS = {
  'nav-library': () => { S.view = 'library'; closeSide(); render(); },
  'nav-boards': () => { S.view = 'boards'; closeSide(); render(); },
  type: a => { S.view = 'library'; S.type = a.dataset.id; closeSide(); render(); $('#content').scrollTop = 0; },
  'type-add': () => addType(),
  'type-edit': (a, e) => { e.stopPropagation(); editType(a.dataset.id); },
  'board-open': a => { closeDetail(); S.view = 'board'; S.boardId = a.dataset.id; closeSide(); render(); $('#content').scrollTop = 0; },
  'board-add': () => addBoard(),
  'board-edit': a => editBoard(a.dataset.id),
  'show-unsorted': () => { S.view = 'library'; S.type = 'all'; S.filters = [{ k: 'noboard', v: 'Без доски' }]; render(); },
  filter: a => toggleFilter(a.dataset.k, a.dataset.v),
  'filter-clear': () => { S.filters = []; S.q = ''; const q = $('#q'); if (q) q.value = ''; render(); },
  'facet-more': a => { S.facetOpen[a.dataset.k] = !S.facetOpen[a.dataset.k]; renderSide(); },
  open: a => openDetail(a.closest('.card').dataset.id),
  boards: (a, e) => { e.stopPropagation(); const id = a.closest('.card').dataset.id; if ($('#pop')) { closePop(); return; } openBoardsPop(a, id); },
  add: () => openAdd(),
  publish: () => openPublish(),
  settings: () => openSettings('ai'),
  'settings-pub': () => openSettings('publish'),
  burger: () => { const open = !$('#side').classList.contains('open'); $('#side').classList.toggle('open', open); $('#sidebd').classList.toggle('show', open); },
  copy: a => copyText(a.dataset.v, 'Скопировано: ' + a.dataset.v.slice(0, 40)),
  'd-close': () => closeDetail(),
  'd-prev': () => stepDetail(-1),
  'd-next': () => stepDetail(1),
  'd-boards': a => openBoardsPop(a, S.openId),
  'd-analyze': () => enqueue(S.openId),
  'd-tag': a => { const k = a.dataset.k, v = a.dataset.v; closeDetail(); if (S.view === 'boards') S.view = 'library'; if (!isActive(k, v)) S.filters.push({ k, v }); render(); },
  'd-tagdel': async (a, e) => { e.stopPropagation(); const r = refById(S.openId); r.tags[a.dataset.k] = r.tags[a.dataset.k].filter(t => t !== a.dataset.v); await saveRef(r); renderDetail(); updateCard(r); renderSide(); },
  'd-fontdel': async a => { const r = refById(S.openId); r.fonts.splice(+a.dataset.i, 1); await saveRef(r); renderDetail(); renderSide(); },
  'd-dsdel': async a => { const r = refById(S.openId); if (!r.ds) return; delete r.ds[a.dataset.k]; if (!Object.keys(r.ds).length) r.ds = null; await saveRef(r); renderDetail(); },
  'd-css': () => { const r = refById(S.openId); copyText(dsToCSS(r.ds, r.title), 'CSS-переменные скопированы'); },
  'd-json': () => { const r = refById(S.openId); copyText(JSON.stringify({ title: r.title, fonts: r.fonts, palette: r.palette, designSystem: r.ds }, null, 2), 'JSON скопирован'); },
  'd-replace': () => { const p = $('#replacepick'); const id = S.openId; p.onchange = async () => { const f = p.files[0]; p.value = ''; const r = refById(id); if (f && r) { try { const link = isPageLink(r); await attachImage(r, f); if (!link) toast('Изображение заменено'); } catch (e) { toast(e.message, 'err'); } } }; p.click(); },
  'd-raw': () => { const r = refById(S.openId); if (r?.ai?.raw) showRaw(r); },
  'd-reshoot': () => { const r = refById(S.openId); if (r && isPageLink(r)) shootLink(r); },
  'd-usershot-del': async () => { const r = refById(S.openId); await DB.del('files', r.id + ':user'); r.userShot = false; await saveRef(r); renderDetail(); },
  'd-download': async () => { const r = refById(S.openId); const b = await getFile(r.id, 'orig'); if (b) download(b, cleanName(r.title) + '.' + extOf(b.type)); },
  'd-delete': async () => {
    const r = refById(S.openId); if (!(await confirmDlg('Удалить референс?', `«${esc(r.title)}» будет удалён из библиотеки и со всех досок.`))) return;
    const next = (() => { const l = visibleRefs(); const i = l.findIndex(x => x.id === r.id); return l[i + 1] || l[i - 1]; })();
    S.refs = S.refs.filter(x => x.id !== r.id); S.queue = S.queue.filter(x => x !== r.id); await DB.del('refs', r.id); await delFiles(r.id); dropThumb(r.id); markChanged();
    closeDetail(); render(); toast('Референс удалён');
    if (next) openDetail(next.id);
  },
};
function closeSide() { $('#side').classList.remove('open'); $('#sidebd').classList.remove('show'); }
function hideVeil() { $('#veil').classList.remove('show'); dragDepth = 0; }
let dragDepth = 0;
function bindGlobal() {
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const f = ACTIONS[a.dataset.act]; if (f) { if (a.tagName === 'A') return; e.preventDefault(); f(a, e); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest?.('.folder') && e.key === 'Enter') { e.target.click(); return; }
    const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if (e.key === 'Escape') {
      if ($('#pop')) return closePop();
      const ovs = $$('#layer .ov'); if (ovs.length) return ovs[ovs.length - 1]._close();
      if (S.openId) return closeDetail();
      if (typing) e.target.blur();
      return;
    }
    if (typing) return;
    if (e.key === '/' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); $('#q')?.focus(); }
    if (S.openId && !$$('#layer .ov').length) { if (e.key === 'ArrowLeft') stepDetail(-1); if (e.key === 'ArrowRight') stepDetail(1); }
  });
  document.addEventListener('input', debounce(e => { if (e.target.id === 'q') { S.q = e.target.value; renderContent(); renderSide(); } }, 140));
  document.addEventListener('change', e => {
    if (e.target.id === 'grp') { S.group = e.target.checked; lsSet('rb-ui', { group: S.group, sort: S.sort }); renderContent(); }
    if (e.target.id === 'sort') { S.sort = e.target.value; lsSet('rb-ui', { group: S.group, sort: S.sort }); renderContent(); }
  });
  if (PUB) return;
  document.addEventListener('paste', e => {
    if ($$('#layer .ov').length) return;
    const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
    const typing = /INPUT|TEXTAREA/.test(e.target.tagName);
    if (files.length) {
      e.preventDefault(); const r = S.openId && refById(S.openId);
      if (r && !r.hasImg) { attachImage(r, files[0]).then(() => { if (!isPageLink(r)) toast('Изображение добавлено'); }).catch(er => toast(er.message, 'err')); return; }
      addFiles(files); return;
    }
    if (typing) return;
    const t = (e.clipboardData?.getData('text') || '').trim();
    if (/^https?:\/\/\S+$/i.test(t)) { e.preventDefault(); toast('Добавляю ссылку…'); addUrl(t); }
  });
  /* перетаскивание карточек на доски */
  document.addEventListener('dragstart', e => {
    const c = e.target.closest?.('.card'); if (!c) return;
    e.dataTransfer.setData('application/x-rb-ref', c.dataset.id); e.dataTransfer.setData('text/plain', refById(c.dataset.id)?.title || ''); e.dataTransfer.effectAllowed = 'copy';
    c.classList.add('dragging');
  });
  document.addEventListener('dragend', e => { e.target.closest?.('.card')?.classList.remove('dragging'); $$('.drop').forEach(x => x.classList.remove('drop')); });
  const isInternal = e => [...(e.dataTransfer?.types || [])].includes('application/x-rb-ref');
  const isExternal = e => { const t = [...(e.dataTransfer?.types || [])]; return !isInternal(e) && (t.includes('Files') || t.includes('text/uri-list')); };
  document.addEventListener('dragenter', e => { if (isExternal(e) && !$$('#layer .ov').length) { dragDepth++; $('#veil').classList.add('show'); } });
  document.addEventListener('dragleave', e => { if (isExternal(e)) { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) hideVeil(); } });
  document.addEventListener('dragover', e => {
    if (isInternal(e)) { const t = e.target.closest?.('[data-drop-board]'); $$('.drop').forEach(x => x !== t && x.classList.remove('drop')); if (t) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; t.classList.add('drop'); } return; }
    if (isExternal(e)) e.preventDefault();
  });
  document.addEventListener('drop', async e => {
    if (isInternal(e)) {
      const t = e.target.closest?.('[data-drop-board]'); if (!t) return; e.preventDefault(); t.classList.remove('drop');
      const r = refById(e.dataTransfer.getData('application/x-rb-ref')); const b = boardById(t.dataset.dropBoard);
      if (r && b) { if (r.boards.includes(b.id)) toast(`Уже на доске «${b.name}»`); else { await setBoard(r, b.id, true); toast(`Добавлено на доску «${b.name}»`); } }
      return;
    }
    if (!isExternal(e)) return;
    e.preventDefault(); hideVeil();
    const files = [...e.dataTransfer.files];
    if (files.length) return addFiles(files);
    const u = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '').split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#'));
    for (const x of u) await addUrl(x);
  });
}

/* ---------- запуск ---------- */
const packCache = new Map();
function loadPack(i) { if (!packCache.has(i)) packCache.set(i, fetch(`thumbs/p${i}.json?v=${S.pub.v}`).then(r => r.ok ? r.json() : {}).catch(() => ({}))); return packCache.get(i); }
async function pubThumb(ref) { if (ref.t !== undefined && ref.t !== null) { const p = await loadPack(ref.t); if (p[ref.id]) return p[ref.id]; } return ref.remote || null; }
async function boot() {
  const ui = lsGet('rb-ui', {}); if (typeof ui.group === 'boolean') S.group = ui.group; if (ui.sort) S.sort = ui.sort;
  if (PUB) {
    renderTop();
    try {
      const res = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' }); if (!res.ok) throw new Error('Файл с данными не найден (' + res.status + ')');
      const d = await res.json(); S.pub = { v: d.publishedAt, at: d.publishedAt }; S.types = d.types || []; S.boards = d.boards || [];
      S.refs = (d.refs || []).map(r => normalizeRef({ ...r, hasImg: r.t !== undefined, ai: { status: 'done' } })).sort((a, b) => b.createdAt - a.createdAt);
    } catch (e) {
      $('#content').innerHTML = `<div class="empty" style="margin-top:28px"><h3>Не удалось загрузить библиотеку</h3><p>${esc(e.message)}. Если сайт только что опубликован, подождите пару минут и обновите страницу.</p></div>`; renderSide(); bindGlobal(); return;
    }
    renderTop(); render(); bindGlobal(); return;
  }
  try { await DB.open(); }
  catch (e) { $('#content').innerHTML = `<div class="empty" style="margin-top:28px"><h3>Браузер не дал открыть базу</h3><p>${esc(e.message || e)}. Откройте файл в Chrome, Edge, Firefox или Safari без приватного режима.</p></div>`; return; }
  const [refs, boards, types, settings, lastChange] = await Promise.all([DB.all('refs'), DB.all('boards'), DB.get('meta', 'types'), DB.get('meta', 'settings'), DB.get('meta', 'lastChange')]);
  S.refs = refs.map(normalizeRef).sort((a, b) => b.createdAt - a.createdAt);
  S.boards = boards.sort((a, b) => a.createdAt - b.createdAt);
  S.types = types?.length ? types : structuredClone(DEFAULT_TYPES); if (!types) await DB.put('meta', S.types, 'types');
  S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...(settings || {}), gh: { ...DEFAULT_SETTINGS.gh, ...(settings?.gh || {}) } };
  S.lastChange = lastChange || 0;
  navigator.storage?.persist?.().catch(() => {});
  renderTop(); render(); bindGlobal();
  for (const r of S.refs) {
    if (r.shot === 'pending') { addUrlResume(r); continue; }
    if (r.ai?.status === 'pending' || r.ai?.status === 'running') { r.ai = { status: 'none' }; if (providerReady()) enqueue(r.id); else updateCard(r); }
  }
}
function addUrlResume(r) { shootLink(r); }
boot();
</script></body></html>
